[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glama-gateway-mcp"
version = "1.0.0"
description = "A Models Context Protocol (MCP) server that exposes the Glama AI gateway (100+ OpenAI-format models) as MCP tools."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Karun Karun", email = "karun@karun.online"}]
keywords = [
    "mcp", "model-context-protocol", "glama", "llm", "gateway",
    "ai", "tools", "openai-compatible",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4.1"]

[project.scripts]
glama-mcp = "glama_mcp.server:serve_stdio_entry"

[project.urls]
Homepage = "https://github.com/karun99/glama-mcp"
Repository = "https://github.com/karun99/glama-mcp"
JOSS = "https://github.com/karun99/glama-mcp/tree/main/paper"

[tool.setuptools]
packages = ["glama_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]