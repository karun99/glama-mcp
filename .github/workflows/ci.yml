name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest -q --cov=glama_mcp --cov-report=term-missing
      - name: Protocol smoke test over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python -m glama_mcp \
            | python -c "import json,sys; [json.loads(l) for l in sys.stdin]; print('ok')"
      - name: Config blocks validate as JSON
        run: |
          for f in configs/*.json; do python -c "import json;json.load(open('$f'))"; done